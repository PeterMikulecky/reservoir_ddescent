[project]
name = "ddescent"
version = "0.1.0"
description = "LIF reservoir double-descent pilot (Frank 2026)"
requires-python = ">=3.10"
dependencies = [
    "brian2>=2.7",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "pyarrow",   # parquet outputs
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ddescent*"]
